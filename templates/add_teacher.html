<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Προσθήκη Εκπαιδευτικού</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a202c; color: #e2e8f0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #2d3748; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); width: 100%; max-width: 400px; }
        h2 { text-align: center; margin-bottom: 20px; color: #fff; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #4a5568; border-radius: 4px; background: #1a202c; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-submit { background-color: #3182ce; color: white; margin-bottom: 10px; }
        .btn-back { background-color: #4a5568; color: white; text-align: center; display: block; text-decoration: none; font-size: 14px; padding: 10px; border-radius: 4px; box-sizing: border-box; }
        .msg { text-align: center; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="box">
    <h2>➕ Νέος Εκπαιδευτικός</h2>
    
    <label>Ονοματεπώνυμο:</label>
    <input type="text" id="full-name" placeholder="π.χ. ΙΩΑΝΝΗΣ ΠΑΠΑΔΟΠΟΥΛΟΣ" required>

    <label>Username (Μικρά Λατινικά):</label>
    <input type="text" id="username" placeholder="e.g. jpadap" required>

    <label>Password:</label>
    <input type="password" id="password" placeholder="••••••••" required>

    <button onclick="submitTeacher()" class="btn-submit">Αποθήκευση Εκπαιδευτικού</button>
    <a href="/admin" class="btn-back">⬅️ Επιστροφή στο Admin</a>

    <div id="message" class="msg"></div>
</div>

<script>
function submitTeacher() {
    const fullName = document.getElementById('full-name').value.trim();
    const username = document.getElementById('username').value.trim().toLowerCase();
    const password = document.getElementById('password').value.trim();
    const msgDiv = document.getElementById('message');

    if (!fullName || !username || !password) {
        alert("Παρακαλώ συμπληρώστε όλα τα πεδία!");
        return;
    }

    fetch('/admin/add-teacher', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: fullName, username: username, password: password })
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === 'success') {
            msgDiv.style.color = '#48bb78';
            msgDiv.innerText = `✅ ${data.message}`;
            document.getElementById('full-name').value = '';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        } else {
            msgDiv.style.color = '#f56565';
            msgDiv.innerText = `❌ ${data.message}`;
        }
    });
}
</script>

</body>
</html>
